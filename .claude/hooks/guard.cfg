# Read by .claude/hooks/guard.py and tools/test.sh. One per repo.
# test_cmd: what tools/test.sh runs; every line must pass (exit 0). Empty = no test gate on push.
test_cmd = godot --headless --path . --script tools/check_scripts.gd && godot --headless --path . --script tests/run_tests.gd
# pass_line: a line tools/test.sh must see in the output, or the run counts as failed.
pass_line = ^ALL PASS
