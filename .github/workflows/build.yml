name: build

# Every push to main (and every PR): parse every script, run the rule tests, play the whole
# flow with the autoplay bot (screenshots in the run's "renders" artifact), then build a
# signed APK. On main the APK + version.json go to the "dev" release; installed copies offer
# the update in-game (scripts/updater.gd).
# Nothing here is game-specific: package name, APK name and the updater's URL all come from
# the repo name, so a game made from this template builds with no edits.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "grok_art/**"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "grok_art/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GODOT_VERSION: 4.6.3-stable

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write            # main only: the 10 s gameplay clip goes to the dev release
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          sudo apt-get install -y -qq xvfb ffmpeg >/dev/null
      - name: Import
        run: timeout 300 godot --headless --path . --import || true
      - name: Parse every script
        # With autoloads loaded (plain --check-only reports false errors for them). A parse
        # error makes a scene hang instead of failing, so this runs first.
        run: timeout 120 godot --headless --path . --script tools/check_scripts.gd 2>&1 | tee check.log; grep -q "^SCRIPTS OK" check.log
      - name: Buffer sender only makes drafts
        run: python3 tools/test_buffer_drafts.py
      - name: Rule tests
        run: XDG_DATA_HOME=$(mktemp -d) timeout 120 godot --headless --path . --script tests/run_tests.gd 2>&1 | tee tests.log; grep -q "^ALL PASS" tests.log
      - name: Autoplay (boot -> intro -> title -> play -> pause -> settings -> continue -> game over -> title)
        run: |
          mkdir -p renders
          tools/autoplay.sh $PWD/renders
          ! grep -qE "^FAIL|SCRIPT ERROR" autoplay.log
          grep -q "^CLIP PASS" autoplay.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders
          path: renders
      - name: Gameplay clip to the "dev" release (main only)
        # renders/gameplay.mp4 = 10 s of real play recorded by the bot; watch it without installing.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f renders/gameplay.mp4
          cp renders/gameplay.mp4 "${GITHUB_REPOSITORY#*/}_gameplay.mp4"
          gh release view dev >/dev/null 2>&1 || gh release create dev --prerelease --title "Latest dev build" --notes "Rebuilt on every push to main."
          gh release upload dev "${GITHUB_REPOSITORY#*/}_gameplay.mp4" --clobber

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Godot + export templates
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o tpl.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q tpl.tpz -d /tmp/tpl
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
      - name: Signing key (the keystone)
        # Android only installs an update over an app signed with the SAME key. The keystone signs
        # every Duff game except Lethemoor (own key). signing/unlock.sh picks the key; docs/SIGNING.md.
        env:
          KEYSTONE_PASS: ${{ secrets.KEYSTONE_PASS }}
        run: |
          bash signing/unlock.sh
          mkdir -p ~/.config/godot
          MM=$(echo "$GODOT_VERSION" | cut -d- -f1 | cut -d. -f1,2)
          cat > ~/.config/godot/editor_settings-$MM.tres <<TRES
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          TRES
          cp ~/.config/godot/editor_settings-$MM.tres ~/.config/godot/editor_settings-4.tres
      - name: Stamp build number, repo and package name
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SLUG=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')
          case "$SLUG" in [0-9]*) SLUG="g$SLUG";; esac
          TITLE=$(sed -n 's/^config\/name="\(.*\)"/\1/p' project.godot)
          echo "${GITHUB_SHA::7} $(date -u +%Y-%m-%d) #${{ github.run_number }}" > build.txt
          echo "${{ github.run_number }}" > build_code.txt
          echo "$GITHUB_REPOSITORY" > repo.txt
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"0.1.${{ github.run_number }}\"/" export_presets.cfg
          sed -i "s/^package\/unique_name=.*/package\/unique_name=\"com.duffpowell.$SLUG\"/; s/^package\/name=.*/package\/name=\"$TITLE\"/" export_presets.cfg
          grep -nE "^(version|package)/" export_presets.cfg
          echo "APK=$REPO_NAME.apk" >> $GITHUB_ENV
      - name: Import
        run: timeout 300 godot --headless --path . --import || true
      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/$APK 2>&1 | tee export.log
          grep -A8 "configuration errors" export.log || true
          test -f build/android/$APK
          ls -la build/android
      - name: Check the APK can update itself
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt
          $AAPT dump badging build/android/$APK | grep -E "^package:"
          $AAPT dump permissions build/android/$APK | tee perms.txt
          grep -q "REQUEST_INSTALL_PACKAGES" perms.txt
          grep -q "android.permission.INTERNET" perms.txt
          grep -q "android.permission.VIBRATE" perms.txt
          $AAPT dump badging build/android/$APK | grep -q "versionCode='${{ github.run_number }}'"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/android/${{ env.APK }}
      - name: Publish to the "dev" release (main only)
        # One fixed release: Releases -> dev -> tap the APK. version.json goes up LAST so a
        # phone never sees a build number before its APK is there.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev >/dev/null 2>&1 || gh release create dev --prerelease --title "Latest dev build" --notes "Rebuilt on every push to main."
          gh release upload dev build/android/$APK --clobber
          echo "{\"code\": ${{ github.run_number }}, \"sha\": \"${GITHUB_SHA::7}\"}" > version.json
          gh release upload dev version.json --clobber
          gh release edit dev --notes "Rebuilt on every push to main. Last: build ${{ github.run_number }} (${GITHUB_SHA::7})"
