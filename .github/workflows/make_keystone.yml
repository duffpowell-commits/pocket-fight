name: make keystone (run once)
# Makes the keystone: the one signing key for every Duff game except Lethemoor (docs/SIGNING.md).
# Needs the KEYSTONE_PASS secret first. Commits signing/keystone.keystore.enc + keystone.sha256
# to main. Refuses if the keystone already exists, so it can never be replaced by accident.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Make the keystone
        env:
          KEYSTONE_PASS: ${{ secrets.KEYSTONE_PASS }}
        run: bash signing/make_keystone.sh
      - name: Check it unlocks the way the build will
        env:
          KEYSTONE_PASS: ${{ secrets.KEYSTONE_PASS }}
        run: bash signing/unlock.sh && rm -f debug.keystore
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing/keystone.keystore.enc signing/keystone.sha256
          git commit -m "Keystone signing key (encrypted) + fingerprint"
          git push
